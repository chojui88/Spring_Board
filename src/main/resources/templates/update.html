<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>update</title>
</head>
<body>
<form action="/board/update" method="post" name="updateForm">
    <input type="hidden" name="id" th:value="${boardUpdate.id}"> <!-- th:value 컨트롤러에서 받아온값 -->
    writer: <input type="text" name="boardWriter" th:value="${boardUpdate.boardWriter}" readonly> <br>
    pass: <input type="text" name="boardPass" id="boardPass"> <br> <!-- 한번 더 검증하려고 th 없음-->
    title: <input type="text" name="boardTitle" th:value="${boardUpdate.boardTitle}"> <br>
    contents: <textarea name="boardContents" cols="30" rows="10" th:text="${boardUpdate.boardContents}"></textarea> <br>
    <!-- textarea는 input 테그보다 넓게 받을 수 있음, 그래서 th:value 가 아니라 text-->
    <input type="hidden" name="boardHits" th:value="${boardUpdate.boardHits}"> <!--조회수 숨겨짐 -->
    <input type="button" value="글수정" onclick="boardUpdate()"> <!-- 함수 호출해서 클릭하면 비밀번호 인증-->
</form>
<script th:inline="javascript">
    const boardUpdate = () => {
      const pass = [[${boardUpdate.boardPass}]];
      const inputPass = document.getElementById("boardPass").value;
      if (pass == inputPass) {
        document.updateForm.submit();
      } else {
        alert("비밀번호가 일치하지 않습니다!");
      }
    }
</script>
</body>
